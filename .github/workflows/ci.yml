name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node（构建、类型检查、测试）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [24.22.2, 26.13.0]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  consumer:
    name: "消费方冒烟（npm file: → build → start）"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:consumer

  desktop:
    name: "桌面打包形态冒烟（package-desktop → 启动）"
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: 安装 WebKit2GTK 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: packages/shell/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:desktop

  shell:
    name: Go 外壳（Linux 构建与测试）
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 安装 WebKit2GTK 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: packages/shell/go.sum
      - run: pnpm install --frozen-lockfile
      - name: gofmt
        run: |
          cd packages/shell
          test -z "$(gofmt -l .)"
      - name: go vet
        run: cd packages/shell && go vet ./...
      - name: 外壳测试与打包脚本冒烟
        run: pnpm test:shell
